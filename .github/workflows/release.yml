name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare tag with workspace version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          TAG="${GITHUB_REF_NAME}"
          echo "Cargo.toml 版本: ${VERSION}"
          echo "tag: ${TAG}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::tag ${TAG} 与 Cargo.toml 版本 v${VERSION} 不一致"
            exit 1
          fi

  build-macos:
    name: macOS universal
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/biuviewer \
            target/aarch64-apple-darwin/release/biuviewer \
            -output target/release/biuviewer
          lipo -info target/release/biuviewer

      - name: Bundle .app
        run: ./scripts/bundle-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: target/bundle/BiuViewer-v*-macOS-universal.zip
          if-no-files-found: error

  build-windows:
    name: Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Bundle portable zip
        run: ./scripts/bundle-windows.sh
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: target/bundle/BiuViewer-v*-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Linux x86_64
    needs: verify
    # 固定在 Ubuntu 22.04 构建：ubuntu-latest 已漂移到 26.04（glibc 2.43），
    # 会让产物把 glibc 下限抬到 2.43，Ubuntu 22.04/24.04 都无法启动。
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Check GLIBC floor and run --version
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/biuviewer
          MAX=$(readelf -V "$BIN" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "产物最高 glibc 需求: ${MAX}（目标上限 2.35）"
          if dpkg --compare-versions "$MAX" gt 2.35; then
            echo "::error::产物依赖 glibc ${MAX}，超过 Ubuntu 22.04 的 2.35；请检查构建环境"
            exit 1
          fi
          "$BIN" --version

      - name: Bundle tar.gz
        run: ./scripts/bundle-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: target/bundle/BiuViewer-v*-linux-x86_64.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files and checksums
        run: |
          mkdir -p release
          cp artifacts/macos-bundle/* release/
          cp artifacts/windows-bundle/* release/
          cp artifacts/linux-bundle/* release/
          cd release
          sha256sum BiuViewer-* > checksums.txt
          cat checksums.txt

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cat > release_notes.md <<EOF
          ## 博览 BiuViewer ${TAG}

          ### 下载

          | 平台 | 文件 | 说明 |
          |:---|:---|:---|
          | macOS | BiuViewer-${TAG}-macOS-universal.zip | 通用二进制（Intel + Apple Silicon） |
          | Windows | BiuViewer-${TAG}-windows-x64.zip | 64 位便携版 |
          | Linux | BiuViewer-${TAG}-linux-x86_64.tar.gz | 64 位 tar.gz |

          ### 安装

          **macOS**：解压后把 \`BiuViewer.app\` 拖入「应用程序」。首次启动如被拦下，
          右键点击应用选择「打开」，或执行 \`xattr -cr /Applications/BiuViewer.app\`。

          **Windows**：解压后双击 \`biuviewer.exe\`。遇到 SmartScreen 提示时点击
          「更多信息」→「仍要运行」。

          **Linux**：解压后执行 \`./install.sh\`（安装到 \`~/.local\`），或直接运行 \`./bin/biuviewer\`。

          ### 校验和

          \`\`\`bash
          shasum -a 256 -c checksums.txt --ignore-missing
          \`\`\`

          ---

          本项目不提供代码签名，首次运行时系统可能提示安全警告。
          EOF

      - name: Determine prerelease
        id: prerelease
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "${TAG}" in
            *-rc*|*-beta*|*-alpha*) echo "value=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: BiuViewer ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release/BiuViewer-*
            release/checksums.txt
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
