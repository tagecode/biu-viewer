[workspace]
resolver = "2"
members = [
    "crates/biuviewer",
    "crates/biuviewer-core",
    "crates/biuviewer-ui",
    "crates/biuviewer-decoder",
    "crates/biuviewer-platform",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.93"
publish = false
description = "博览 BiuViewer，轻量跨平台图片查看器"

# 依赖方向（Arch 2.2.2，禁止反向与循环）:
#   biuviewer -> biuviewer-ui, biuviewer-platform, biuviewer-core
#   biuviewer-ui -> biuviewer-core, biuviewer-decoder
#   biuviewer-decoder -> biuviewer-core
#   biuviewer-platform -> biuviewer-core
#   biuviewer-core -> （不依赖其他工作区 crate）
[workspace.dependencies]
biuviewer-core = { path = "crates/biuviewer-core" }
biuviewer-ui = { path = "crates/biuviewer-ui" }
biuviewer-decoder = { path = "crates/biuviewer-decoder" }
biuviewer-platform = { path = "crates/biuviewer-platform" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gpui-kit = "=0.9.0"
image = { version = "0.25.10", default-features = false }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
strip = false
debug = true

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
